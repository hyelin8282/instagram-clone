    <div class="feed-list-area">
            
            <article class="feed-post">
                <div class="feed-header">
                    <div class="feed-author">
                        <img src="assets/images/avatar.png" alt="프로필" class="feed-avatar">

                            <circle cx="6" cy="12" r="1.5"></circle>
                            <circle cx="18" cy="12" r="1.5"></circle>
                        </svg>

                <div class="feed-image-wrap">
                    <img src="assets/images/likestrawberries.jpg" alt="피드 이미지" class="feed-image">
                </div>

                <div class="feed-footer">
                    <div class="feed-actions">

                            <button><img src="assets/icons/heart.svg" alt="좋아요"></button>

                    <div class="feed-caption">

                    </div>

        <!-- PC sidebar-right -->
    <aside class="sidebar-right">
        <div class="user-status-card">

            <div class="recommend-user">
